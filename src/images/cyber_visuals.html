<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiCleaner Quantum HUD • Cyber Visuals Edition</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }
  body {
    background: #06080f;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  #canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  .hud-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 32px;
  }
  .hud-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .glass-card {
    background: rgba(14, 20, 34, 0.65);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 16px 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    pointer-events: auto;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .glass-card:hover {
    border-color: rgba(56, 189, 248, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 20px 50px rgba(56, 189, 248, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-logo {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #38bdf8, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
  }
  .brand-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }
  .brand-title span {
    color: #38bdf8;
  }
  .brand-sub {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-pro {
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
    border: 1px solid rgba(245, 158, 11, 0.5);
    color: #f59e0b;
    font-size: 10px;
    font-weight: 900;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }
  .hud-center {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    pointer-events: none;
  }
  .quantum-ring {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    border: 2px dashed rgba(56, 189, 248, 0.3);
    position: absolute;
    animation: rotateRing 20s linear infinite;
  }
  .quantum-ring-2 {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    border: 1px solid rgba(168, 85, 247, 0.25);
    position: absolute;
    animation: rotateRingRev 15s linear infinite;
  }
  @keyframes rotateRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes rotateRingRev {
    0% { transform: rotate(360deg); }
    100% { transform: rotate(0deg); }
  }
  .core-btn {
    pointer-events: auto;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(14, 20, 34, 0.9) 70%);
    border: 2px solid rgba(56, 189, 248, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 35px rgba(56, 189, 248, 0.4);
    transition: all 0.3s ease;
  }
  .core-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 60px rgba(56, 189, 248, 0.7);
    border-color: #38bdf8;
  }
  .core-btn:active {
    transform: scale(0.95);
  }
  .core-btn span:first-child {
    font-size: 32px;
  }
  .core-btn span:last-child {
    font-size: 11px;
    font-weight: 900;
    color: #38bdf8;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .hud-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
  }
  .telemetry-row {
    display: flex;
    gap: 16px;
  }
  .metric-card {
    min-width: 160px;
  }
  .metric-label {
    font-size: 10px;
    font-weight: 800;
    color: #64748b;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .metric-value {
    font-size: 24px;
    font-weight: 900;
    color: #38bdf8;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .metric-unit {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
  }
  .metric-bar {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .metric-fill {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #8b5cf6);
    width: 45%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .controls-card {
    display: flex;
    gap: 10px;
  }
  .pill-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #f1f5f9;
    font-size: 11px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .pill-btn:hover {
    background: rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
    color: #38bdf8;
  }
  .pill-btn.active {
    background: #38bdf8;
    color: #06080f;
    border-color: #38bdf8;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="hud-overlay">
  <!-- Header -->
  <div class="hud-header">
    <div class="glass-card brand">
      <div class="brand-logo">⚡</div>
      <div>
        <div class="brand-title">Opti<span>Cleaner</span> Quantum</div>
        <div class="brand-sub">
          <span style="color:#10b981;">●</span> ONLINE • ELECTRON / JS VISUALS
        </div>
      </div>
    </div>

    <div class="glass-card" style="display:flex; align-items:center; gap:12px;">
      <span class="badge-pro">👑 1000₽ MAXIMUM EDITION</span>
      <span style="font-size:11px; color:#94a3b8; font-weight:700;">FPS: <span id="fps" style="color:#10b981;">60</span></span>
    </div>
  </div>

  <!-- Center Quantum Core -->
  <div class="hud-center">
    <div class="quantum-ring"></div>
    <div class="quantum-ring-2"></div>
    <div class="core-btn" id="boostBtn" onclick="triggerBoost()">
      <span>⚡</span>
      <span id="boostText">BOOST</span>
    </div>
  </div>

  <!-- Bottom Telemetry -->
  <div class="hud-bottom">
    <div class="telemetry-row">
      <div class="glass-card metric-card">
        <div class="metric-label">🧠 CPU LATENCY</div>
        <div class="metric-value"><span id="cpuVal">0.50</span> <span class="metric-unit">ms</span></div>
        <div class="metric-bar"><div class="metric-fill" id="cpuBar" style="width: 25%;"></div></div>
      </div>
      <div class="glass-card metric-card">
        <div class="metric-label">⚡ RAM COMPRESSION</div>
        <div class="metric-value"><span id="ramVal">98.4</span> <span class="metric-unit">%</span></div>
        <div class="metric-bar"><div class="metric-fill" id="ramBar" style="width: 98%; background: linear-gradient(90deg, #a855f7, #ec4899);"></div></div>
      </div>
      <div class="glass-card metric-card">
        <div class="metric-label">🎮 SHADER CACHE</div>
        <div class="metric-value"><span id="shaderVal">CLEAN</span></div>
        <div class="metric-bar"><div class="metric-fill" id="shaderBar" style="width: 100%; background: #10b981;"></div></div>
      </div>
    </div>

    <div class="glass-card controls-card">
      <button class="pill-btn active" onclick="setMode('cyber')">🌌 Cyber</button>
      <button class="pill-btn" onclick="setMode('matrix')">🟢 Matrix</button>
      <button class="pill-btn" onclick="setMode('aurora')">✨ Aurora</button>
      <button class="pill-btn" onclick="setMode('frost')">❄️ Frost</button>
    </div>
  </div>
</div>

<script>
  // Web Audio Synthesizer for high-tech chimes
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function playBeep(freq = 880, dur = 0.1, type = 'sine') {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  // Canvas & Particles
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let mode = 'cyber';
  const themeColors = {
    cyber: ['#38bdf8', '#818cf8', '#a855f7', '#ec4899'],
    matrix: ['#10b981', '#34d399', '#059669', '#6ee7b7'],
    aurora: ['#2dd4bf', '#06b6d4', '#14b8a6', '#5eead4'],
    frost: ['#60a5fa', '#93c5fd', '#38bdf8', '#e2e8f0']
  };

  const particles = [];
  const NUM_PARTICLES = 70;
  for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 1.5,
      vy: (Math.random() - 0.5) * 1.5,
      radius: Math.random() * 2.5 + 1.5,
      pulse: Math.random() * Math.PI * 2
    });
  }

  let mouse = { x: width / 2, y: height / 2, down: false };
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  let ripples = [];
  window.addEventListener('click', (e) => {
    ripples.push({ x: e.clientX, y: e.clientY, r: 0, maxR: 180, alpha: 0.8 });
    playBeep(1200, 0.08);
  });

  function setMode(newMode) {
    mode = newMode;
    document.querySelectorAll('.pill-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(newMode)) {
        btn.classList.add('active');
      }
    });
    playBeep(980, 0.06);
  }
  window.setMode = setMode;

  window.updateTelemetry = function(cpu, ram) {
    if (cpu !== undefined) {
      const el = document.getElementById('cpuVal');
      if (el) el.innerText = parseFloat(cpu).toFixed(1);
      const b = document.getElementById('cpuBar');
      if (b) b.style.width = Math.min(100, Math.max(5, parseFloat(cpu))) + '%';
    }
    if (ram !== undefined) {
      const el = document.getElementById('ramVal');
      if (el) el.innerText = parseFloat(ram).toFixed(1);
      const b = document.getElementById('ramBar');
      if (b) b.style.width = Math.min(100, Math.max(5, parseFloat(ram))) + '%';
    }
  };

  window.triggerShockwave = function(x, y) {
    const rx = (x !== undefined) ? x : width / 2;
    const ry = (y !== undefined) ? y : height / 2;
    ripples.push({ x: rx, y: ry, r: 0, maxR: 400, alpha: 0.95 });
    playBeep(1174, 0.12);
  };

  function triggerBoost() {
    playBeep(523, 0.1);
    setTimeout(() => playBeep(659, 0.1), 100);
    setTimeout(() => playBeep(784, 0.15), 200);
    setTimeout(() => playBeep(1046, 0.25), 300);

    const btn = document.getElementById('boostBtn');
    const txt = document.getElementById('boostText');
    txt.innerText = 'OPTIMIZING';
    btn.style.transform = 'scale(1.2)';
    btn.style.borderColor = '#10b981';

    // Spawn massive shockwave
    ripples.push({ x: width / 2, y: height / 2, r: 0, maxR: 500, alpha: 1.0 });

    setTimeout(() => {
      txt.innerText = 'MAX 0.5ms';
      btn.style.transform = 'scale(1.0)';
      btn.style.borderColor = '#38bdf8';
      document.getElementById('ramVal').innerText = '100.0';
    }, 1200);
  }

  // Animation Loop
  let lastTime = performance.now();
  let frameCount = 0;
  let fps = 60;

  function render(time) {
    frameCount++;
    if (time - lastTime >= 1000) {
      fps = frameCount;
      document.getElementById('fps').innerText = fps;
      frameCount = 0;
      lastTime = time;
    }

    ctx.fillStyle = 'rgba(6, 8, 15, 0.32)';
    ctx.fillRect(0, 0, width, height);

    const colors = themeColors[mode] || themeColors.cyber;

    // Draw ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rip = ripples[i];
      rip.r += 6;
      rip.alpha *= 0.94;
      ctx.beginPath();
      ctx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(56, 189, 248, ${rip.alpha})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      if (rip.alpha < 0.01) ripples.splice(i, 1);
    }

    // Update & draw particles
    particles.forEach((p, idx) => {
      p.x += p.vx;
      p.y += p.vy;
      p.pulse += 0.05;

      // Mouse repulsion
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 120) {
        const force = (120 - dist) / 120;
        p.x -= (dx / dist) * force * 3;
        p.y -= (dy / dist) * force * 3;
      }

      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;

      // Connections
      for (let j = idx + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const d = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (d < 110) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(56, 189, 248, ${(1 - d / 110) * 0.25})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // Draw particle dot
      const rad = p.radius + Math.sin(p.pulse) * 0.8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.fillStyle = colors[idx % colors.length];
      ctx.shadowColor = colors[idx % colors.length];
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
</script>
</body>
</html>
